<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эксклюзивные лоты</title>
    <style>
        :root {
            --bg-color: #17212b;
            --tg-dark: #0e1621;
            --text-color: #f5f5f5;
            --text-muted: #6c7883;
            --accent-color: #2f6ea5;
            --accent-hover: #3b88c3;
            --border-color: #24303f;
            --success-color: #4da74d;
            --danger-color: #da5656;
            --star-color: #efa929;
            --gram-color: #0088cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--tg-dark);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .contact-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .contact-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Навигационная вкладка */
        .tabs {
            margin-bottom: 20px;
        }

        .tab-item {
            color: var(--accent-hover);
            border-bottom: 2px solid var(--accent-hover);
            padding: 10px 5px;
            font-weight: 500;
            display: inline-block;
            font-size: 16px;
        }

        /* Пароль-панель */
        #auth-panel {
            background-color: var(--bg-color);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        #auth-panel input {
            background-color: var(--tg-dark);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            margin-right: 10px;
        }

        #auth-panel button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Админ-панель */
        #admin-panel {
            background-color: var(--bg-color);
            border: 1px dashed var(--accent-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .admin-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--accent-hover);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background-color: var(--tg-dark);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .price-row {
            display: flex;
            gap: 15px;
        }

        .price-row .form-group {
            flex: 1;
        }

        .submit-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
        }

        /* Таблица лотов в стиле Fragment */
        .table-container {
            background-color: var(--bg-color);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .lots-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .lots-table th {
            background-color: rgba(0,0,0,0.15);
            padding: 14px 18px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lots-table td {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .lots-table tr:last-child td {
            border-bottom: none;
        }

        /* Стилизация контента */
        .lot-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lot-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background-color: var(--tg-dark);
            border: 1px solid var(--border-color);
        }

        .lot-text-wrapper {
            max-width: 450px;
        }

        .lot-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .lot-desc {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.4;
        }

        .lot-price {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-star { color: var(--star-color); }
        .badge-gram { color: var(--gram-color); }

        .action-cell {
            text-align: right;
        }

        .buy-btn {
            background-color: rgba(47, 110, 165, 0.1);
            color: var(--accent-hover);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-block;
        }

        .buy-btn:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .delete-btn {
            background-color: rgba(218, 86, 86, 0.1);
            color: var(--danger-color);
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background-color: var(--danger-color);
            color: white;
        }

        .mobile-price-container {
            display: none;
        }

        @media (max-width: 768px) {
            .lots-table th:nth-child(2), .lots-table td:nth-child(2) {
                display: none;
            }
            .lot-text-wrapper { max-width: 200px; }
            .mobile-price-container {
                display: block;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <header>
            <div class="logo-area">
                <h1>Магазин Витрина</h1>
                <p>Официальные предложения площадки</p>
            </div>
            <a href="https://t.me/Kallen" target="_blank" class="contact-btn">
                💬 Связаться: @Kallen
            </a>
        </header>

        <!-- Вкладки -->
        <div class="tabs">
            <span class="tab-item">Предложения</span>
        </div>

        <!-- Окно ввода пароля (вызывается по Ctrl+Shift+A) -->
        <div id="auth-panel">
            <input type="password" id="admin-password-input" placeholder="Введите пароль администратора">
            <button onclick="checkAdminPassword()">Войти</button>
        </div>

        <!-- Админ-панель -->
        <div id="admin-panel">
            <div class="admin-title">
                <span>Панель управления (Режим: Администратор)</span>
                <button class="logout-btn" onclick="logoutAdmin()">Выйти из админки</button>
            </div>
            <form id="lot-form">
                <div class="form-group">
                    <label>Название лота</label>
                    <input type="text" id="lot-title" placeholder="Название предложения..." required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="lot-desc" placeholder="Опишите лот подробнее..." required></textarea>
                </div>
                <div class="price-row">
                    <div class="form-group">
                        <label>Количество (Цена)</label>
                        <input type="number" id="lot-price-value" placeholder="Например: 500" required>
                    </div>
                    <div class="form-group">
                        <label>Валюта лота</label>
                        <select id="lot-currency">
                            <option value="⭐️ Звёзды">⭐️ Telegram Stars</option>
                            <option value="💎 GRAM">💎 GRAM</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ссылка на фото / картинку</label>
                    <input type="url" id="lot-img" placeholder="Вставьте URL картинки (или оставьте пустым)">
                </div>
                <button type="submit" class="submit-btn">Опубликовать на витрину</button>
            </form>
        </div>

        <!-- Таблица предложений -->
        <div class="table-container">
            <table class="lots-table">
                <thead>
                    <tr>
                        <th>Лот / Предложение</th>
                        <th>Цена</th>
                        <th style="text-align: right;">Действие</th>
                    </tr>
                </thead>
                <tbody id="lots-container">
                    <!-- Загрузка скриптом -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // По умолчанию дефолтных рублей нет. Оставляем чистую структуру под Stars и GRAM.
        const defaultLots = [
            {
                id: 1,
                title: "Эксклюзивный цифровой арт #001",
                desc: "Уникальный графический объект для вашей коллекции в приватном канале.",
                priceValue: "2500",
                currency: "⭐️ Звёзды",
                img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150"
            },
            {
                id: 2,
                title: "Коллекционный токен площадки",
                desc: "Редкий распределяемый актив комьюнити.",
                priceValue: "150",
                currency: "💎 GRAM",
                img: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=150"
            }
        ];

        // Измените этот пароль на свой секретный!
        const ADMIN_PASSWORD = "KallenAdmin777"; 

        let lots = JSON.parse(localStorage.getItem('tg_private_lots_v2')) || defaultLots;
        // Проверяем сессию админа, чтобы не вводить пароль при каждом обновлении страницы
        let isAdmin = sessionStorage.getItem('is_tg_admin') === 'true';

        function renderLots() {
            const container = document.getElementById('lots-container');
            container.innerHTML = '';

            if (lots.length === 0) {
                container.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #6c7883; padding: 40px;">На данный момент нет активных предложений.</td></tr>`;
                return;
            }

            lots.forEach(lot => {
                const tr = document.createElement('tr');
                const imgUrl = lot.img || 'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=150';
                
                // Стилизация иконки валюты
                let priceClass = lot.currency.includes('Звёзд') ? 'badge-star' : 'badge-gram';
                let priceHTML = `<span class="lot-price ${priceClass}">${lot.priceValue} ${lot.currency}</span>`;

                let actionButtons = `<a href="https://t.me/Kallen" target="_blank" class="buy-btn">Купить</a>`;
                if (isAdmin) {
                    actionButtons += `<button class="delete-btn" onclick="deleteLot(${lot.id})">Удалить</button>`;
                }

                tr.innerHTML = `
                    <td>
                        <div class="lot-info">
                            <img src="${imgUrl}" class="lot-image" alt="lot">
                            <div class="lot-text-wrapper">
                                <div class="lot-name">${lot.title}</div>
                                <div class="lot-desc">${lot.desc}</div>
                                <div class="mobile-price-container">${priceHTML}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        ${priceHTML}
                    </td>
                    <td class="action-cell">
                        ${actionButtons}
                    </td>
                `;
                container.appendChild(tr);
            });
        }

        // Логика авторизации
        function checkAdminPassword() {
            const input = document.getElementById('admin-password-input');
            if (input.value === ADMIN_PASSWORD) {
                isAdmin = true;
                sessionStorage.setItem('is_tg_admin', 'true');
                document.getElementById('auth-panel').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                input.value = '';
                renderLots();
            } else {
                alert('Неверный пароль администратора!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            sessionStorage.removeItem('is_tg_admin');
            document.getElementById('admin-panel').style.display = 'none';
            renderLots();
        }

        // Добавление лота
        document.getElementById('lot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newLot = {
                id: Date.now(),
                title: document.getElementById('lot-title').value,
                desc: document.getElementById('lot-desc').value,
                priceValue: document.getElementById('lot-price-value').value,
                currency: document.getElementById('lot-currency').value,
                img: document.getElementById('lot-img').value
            };

            lots.unshift(newLot);
            localStorage.setItem('tg_private_lots_v2', JSON.stringify(lots));
            renderLots();
            this.reset();
        });

        // Удаление лота
        function deleteLot(id) {
            if (confirm('Вы уверены, что хотите удалить этот лот?')) {
                lots = lots.filter(lot => lot.id !== id);
                localStorage.setItem('tg_private_lots_v2', JSON.stringify(lots));
                renderLots();
            }
        }

        // Хоткей Ctrl + Shift + A вызывает окно авторизации или сразу панель
        window.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.code === 'KeyA') {
                e.preventDefault();
                if (isAdmin) {
                    // Если уже админ, скрываем/показываем панель управления
                    const panel = document.getElementById('admin-panel');
                    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
                } else {
                    // Если не админ, просим пароль
                    const auth = document.getElementById('auth-panel');
                    auth.style.display = (auth.style.display === 'block') ? 'none' : 'block';
                    if (auth.style.display === 'block') {
                        document.getElementById('admin-password-input').focus();
                    }
                }
            }
        });

        // Инициализация при загрузке
        if (isAdmin) {
            document.getElementById('admin-panel').style.display = 'block';
        }
        renderLots();
    </script>
</body>
</html>
