<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TonnelMarket — Премиум Платформа</title>
    <style>
        :root {
            --bg-color: #0b141c;
            --surface-color: #17212b;
            --text-color: #f5f5f5;
            --text-muted: #708499;
            --accent-stars: #ffa726;
            --accent-gram: #24a1de;
            --border-color: #24313f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, var(--accent-gram), #54b4e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .market-container {
            width: 100%;
            max-width: 800px;
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .lot-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .lot-card:hover {
            border-color: #2b394a;
            transform: translateY(-1px);
        }

        .lot-info .lot-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .lot-info .lot-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        .lot-pricing {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .price-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
        }

        .price-tag.stars { color: var(--accent-stars); }
        .price-tag.gram { color: var(--accent-gram); }

        .buy-btn {
            background-color: #24a1de;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .buy-btn:hover {
            background-color: #1d82b3;
        }

        .status-message {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-top: 40px;
        }

        footer {
            margin-top: auto;
            padding: 40px 0 10px 0;
            text-align: center;
        }

        footer p {
            font-size: 10px;
            color: rgba(112, 132, 153, 0.4);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>TonnelMarket</h1>
        <p>Аналог Fragment для приватного канала</p>
    </header>

    <div class="market-container" id="marketLots">
        <div class="status-message">Загрузка актуальных предложений...</div>
    </div>

    <footer>
        <p>сайт создавался для catugram</p>
    </footer>

    <script>
        const SPREADSHEET_ID = '1erOanb6E6bPqGi9RQSRlQfJhFgVufmotQ-8U83TP1no';
        // Используем чистый экспорт в CSV — это работает быстрее и надежнее всего
        const csvUrl = `https://google.com{SPREADSHEET_ID}/export?format=csv&id=${SPREADSHEET_ID}`;

        // Функция для безопасного разбора строк CSV с удалением кавычек
        function parseCSVLine(line) {
            let result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        async function loadMarketData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Network error');
                
                const text = await response.text();
                const lines = text.split(/\r?\n/);
                const container = document.getElementById('marketLots');
                
                let htmlContent = '';

                // Пробегаем по строкам таблицы начиная со второй (индекс 1)
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue; // Пропускаем пустые строки
                    
                    const row = parseCSVLine(lines[i]);
                    if (!row[0]) continue; // Пропускаем, если нет названия лота

                    const title = row[0];
                    const desc = row[1] || '';
                    const currency = (row[2] || 'stars').toLowerCase().trim();
                    const price = row[3] || '0';

                    const currencySign = currency === 'gram' ? '💎' : '⭐️';
                    const currencyText = currency === 'gram' ? 'GRAM' : 'Stars';
                    const currencyClass = currency === 'gram' ? 'gram' : 'stars';

                    htmlContent += `
                        <div class="lot-card">
                            <div class="lot-info">
                                <div class="lot-title">${title}</div>
                                <div class="lot-desc">${desc}</div>
                            </div>
                            <div class="lot-pricing">
                                <div class="price-tag ${currencyClass}">
                                    ${currencySign} ${price} ${currencyText}
                                </div>
                                <a href="https://t.me" target="_blank" class="buy-btn">Купить</a>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = htmlContent || '<div class="status-message">На данный момент активных предложений нет.</div>';

            } catch (error) {
                console.error(error);
                document.getElementById('marketLots').innerHTML = 
                    '<div class="status-message" style="color:#e53935;">Ошибка обновления. Пожалуйста, обновите страницу через вкладку Инкогнито (сброс кэша).</div>';
            }
        }

        loadMarketData();
    </script>
</body>
</html>
